# Packages depcheck cannot see a require/import for. Each is reached through a config
# file or a script bin rather than source, so absence from `ts/` is expected.
ignores:
  # invoked by .husky/commit-msg, configured by commitlint.config.cjs
  - '@commitlint/cli'
  - '@commitlint/config-conventional'
  # extended by biome.json
  - '@repobuddy/biome'
  # ambient jest globals for the specs
  - '@types/jest'
  # named by jest.config.js in `transform`, which depcheck's jest parser does not read
  # (it only understands `preset`)
  - ts-jest
  # bin, used by the `clean` script
  - rimraf
